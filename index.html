<!DOCTYPE html>
<html lang="en" class="dark min-h-screen bg-[#070809]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Akash Fitness" />
  <meta name="application-name" content="Akash Fitness" />
  <meta name="theme-color" content="#070809" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <title id="page-title">Akash Fitness — Member HUD</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Supabase JS v2 Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- HTML5 QR Code Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            void: '#070809',
            obsidian: 'rgba(18, 20, 26, 0.75)',
            surfaceCard: '#10121a',
            surfaceMuted: '#161924',
            cyberVolt: '#CCFF00',
            matrixGreen: '#00FF66',
            crimsonAlert: '#FF3366',
            moltenGold: '#FFB800',
            cyanCyber: '#00F0FF'
          },
          fontFamily: {
            brand: ['"Syne"', 'sans-serif'],
            mono: ['"Space Mono"', 'monospace'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          boxShadow: {
            'glow-volt': '0 0 25px rgba(204, 255, 0, 0.35)',
            'glow-green': '0 0 25px rgba(0, 255, 102, 0.35)',
            'glow-gold': '0 0 30px rgba(255, 184, 0, 0.3)',
            'glow-crimson': '0 0 25px rgba(255, 51, 102, 0.4)',
            'glow-cyan': '0 0 25px rgba(0, 240, 255, 0.35)',
            'glass-card': '0 20px 50px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(255, 255, 255, 0.08)'
          }
        }
      }
    };
  </script>

  <!-- Canonical Styles & Viewport Bounds -->
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #070809;
      color: #f4f4f5;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="min-h-screen bg-void text-zinc-100 font-sans antialiased selection:bg-cyberVolt selection:text-black">

  <!-- CANONICAL MEMBER PORTAL ROOT -->
  <div id="nexus-app-root"></div>

  <!-- CANONICAL MEMBER RUNTIME -->
  <script src="./nexus-member-ui.js"></script>

  <!-- SERVICE WORKER REGISTRATION -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => {
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          })
          .catch((err) => {
            console.warn('[SW] Registration warning:', err);
          });
      });
    }
  </script>
</body>
</html>
