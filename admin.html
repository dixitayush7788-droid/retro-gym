<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070B14">
  <title>NEXUS COMMAND</title>
  <style>
    html,body{margin:0;min-height:100%;background:#070B14;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    #boot{display:grid;place-items:center;gap:12px;text-align:center;padding:24px}
    #boot-icon{font-size:42px;line-height:1}
    #status{font-size:14px;font-weight:700;letter-spacing:.02em;max-width:90vw}
    #detail{font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#94a3b8;max-width:90vw;text-align:center}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="boot">
    <div id="boot-icon">⚡</div>
    <div id="status">SECURE BOOT — VERIFYING SESSION…</div>
    <div id="detail"></div>
  </div>

  <script>
  (function(){
    'use strict';
    const SUPABASE_URL='https://zfvkvrhuovvbfbrutpph.supabase.co';
    const SUPABASE_KEY='sb_publishable_bFbeqpwaWmp0aioDVSkLAg_J7X4lzWk';
    const status=document.getElementById('status');
    const detail=document.getElementById('detail');
    function setStatus(message,extra){if(status)status.textContent=message;if(detail)detail.textContent=extra||''}
    function goLogin(){window.location.replace('./admin-login.html'+(window.location.search||''))}
    async function loadExternalScript(src,type){return new Promise((resolve,reject)=>{const s=document.createElement('script');if(type)s.type=type;s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Script failed to load: '+src));document.head.appendChild(s)})}
    async function executeCoreScripts(){const nodes=[...document.querySelectorAll('script')];for(const old of nodes){const src=old.getAttribute('src');const type=old.getAttribute('type');const replacement=document.createElement('script');if(type)replacement.setAttribute('type',type);if(src){let resolvedSrc=src;if(/adminAuth\.js(?:\?|$)/.test(resolvedSrc))resolvedSrc=resolvedSrc.replace(/\?.*$/,'')+'?v=20260904-5';if(/adminUXFixes\.js(?:\?|$)/.test(resolvedSrc))resolvedSrc=resolvedSrc.replace(/\?.*$/,'')+'?v=20260904-6';replacement.src=resolvedSrc;await new Promise((resolve,reject)=>{replacement.onload=resolve;replacement.onerror=()=>reject(new Error('Script failed to load: '+resolvedSrc));document.head.appendChild(replacement)})}else{replacement.textContent=old.textContent||'';document.head.appendChild(replacement)}}}
    async function resolveSingleTenant(client){const params=new URLSearchParams(window.location.search);if((params.get('gym')||'').trim())return false;try{const {data:ctx,error}=await client.rpc('rpc_get_current_user_context');if(error)return false;const roles=Array.isArray(ctx?.roles)?ctx.roles:[];const slugs=[...new Set(roles.map(r=>String(r?.gym_slug||'').trim().toLowerCase()).filter(Boolean))];if(slugs.length===1){const url=new URL(window.location.href);url.searchParams.set('gym',slugs[0]);window.location.replace(url.toString());return true}}catch(e){console.warn('[NEXUS ADMIN] Tenant auto-resolution note:',e)}return false}
    async function loadCore(){
      if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Supabase client failed to load. Please check your internet connection.');
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});
      window.__NEXUS_CANONICAL_SUPABASE_CLIENT__=client;window.supabaseClient=client;window.db=client;
      setStatus('SECURE BOOT — CHECKING ACCOUNT…');const result=await client.auth.getSession();if(result.error)throw result.error;if(!result.data?.session?.user){goLogin();return}
      if(await resolveSingleTenant(client))return;
      setStatus('SESSION VERIFIED — LOADING COMMAND DESK…');const response=await fetch('./admin-core.html?v=20260904',{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('Admin core failed to load (HTTP '+response.status+').');let source=await response.text();
      source=source.replace(/SUPABASE_ANON_KEY:\s*'[^']*'/,"SUPABASE_ANON_KEY: '"+SUPABASE_KEY+"'");source=source.replace(/SUPABASE_KEY\s*=\s*'[^']*'/g,"SUPABASE_KEY='"+SUPABASE_KEY+"'");
      if(!source.includes('nexus-owner-ui.css'))source=source.replace('</head>','<link rel="stylesheet" href="./nexus-owner-ui.css?v=20260904">\n</head>');
      if(!source.includes('nexus-owner-ui.js')){const ownerScript='<scr'+'ipt type="module" src="./assets/js/nexus-owner-whatsapp.js?v=20260904-1"></scr'+'ipt><scr'+'ipt src="./nexus-owner-ui.js?v=20260904-5"></scr'+'ipt>';source=source.replace('</body>',ownerScript+'\n</body>')}
      if(!source.includes('nexus-admin-mobile-fallback'))source=source.replace('</head>',`<style id="nexus-admin-mobile-fallback">.hidden{display:none!important}@media(max-width:900px){#add-member-card{max-height:calc(100dvh - 88px)!important;padding-bottom:120px!important;scroll-padding-bottom:120px!important}#add-member-drawer{padding-bottom:82px!important}#nexus-payment-modal>div{max-height:calc(100dvh - 24px)!important;overflow-y:auto!important;padding-bottom:110px!important}}</style>\n</head>`);
      const parsed=new DOMParser().parseFromString(source,'text/html');if(!parsed.body)throw new Error('Admin core returned invalid HTML.');const imported=document.importNode(parsed.documentElement,true);document.documentElement.replaceWith(imported);await executeCoreScripts();await loadExternalScript('./assets/js/adminUXFixes.js?v=20260904-6','module');
    }
    loadCore().catch(error=>{console.error('[NEXUS ADMIN BOOT]',error);setStatus('ADMIN PANEL COULD NOT START',error?.message||'Unknown startup error')});
  })();
  </script>
</body>
</html>
