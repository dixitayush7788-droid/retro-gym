name: One-time NEXUS hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'NEXUS-HOTFIX-APPLIED') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal production fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---- Admin PIN persistence/renewal fix ----
          p = Path('admin-core.html')
          s = p.read_text()
          old = "currentGymAdminPin = gym.admin_pin_hash ? true : null;"
          new = "const savedAdminPin = sessionStorage.getItem('retrogym_admin_pin');\n      currentGymAdminPin = gym.admin_pin_hash ? (savedAdminPin && /^\\d{4}$/.test(savedAdminPin) ? savedAdminPin : true) : null;"
          assert old in s, 'admin-core hydrate marker missing'
          s = s.replace(old, new, 1)

          old = "sessionStorage.setItem(`retrogym_admin_auth_${currentGymSlug}`, 'true');\n        sessionStorage.setItem('retrogym_admin_auth', 'true');\n        const lockModal = document.getElementById('admin-lock-modal');"
          new = "currentGymAdminPin = adminPinBuffer;\n        sessionStorage.setItem(`retrogym_admin_auth_${currentGymSlug}`, 'true');\n        sessionStorage.setItem('retrogym_admin_auth', 'true');\n        sessionStorage.setItem('retrogym_admin_pin', adminPinBuffer);\n        const lockModal = document.getElementById('admin-lock-modal');"
          assert old in s, 'admin-core unlock marker missing'
          s = s.replace(old, new, 1)

          old = "const activeAdminPin = currentGymAdminPin || sessionStorage.getItem('retrogym_admin_pin') || '';"
          new = "const activeAdminPin = (typeof currentGymAdminPin === 'string' && /^\\d{4}$/.test(currentGymAdminPin))\n        ? currentGymAdminPin\n        : (sessionStorage.getItem('retrogym_admin_pin') || '');\n      if (!activeAdminPin) {\n        showToast('Please unlock the gym security PIN before renewing.', 'error');\n        return;\n      }"
          assert old in s, 'admin-core renewal marker missing'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---- Member attendance refresh-state fix ----
          p = Path('index.html')
          s = p.read_text()
          start = s.index('    async function checkTodayAttendancePunchState() {')
          end = s.index('\n    function markPunchButtonVerified(timeIso) {', start)
          replacement = '''    async function checkTodayAttendancePunchState() {
      if (!currentAthlete || !db) return;

      let secureSession = window.__nexusMemberSession;
      if (!secureSession) {
        try { secureSession = JSON.parse(localStorage.getItem('rg_member_session') || 'null'); } catch (_) { secureSession = null; }
      }

      const memberId = secureSession?.member_id || secureSession?.id || currentAthlete.id;
      const sessionToken = secureSession?.session_token;
      if (!memberId || !sessionToken || !currentGymSlug) return;

      try {
        const { data, error } = await db.rpc('rpc_member_attendance_status', {
          p_gym_slug: currentGymSlug,
          p_member_id: memberId,
          p_session_token: sessionToken
        });

        if (error) throw error;
        if (data?.success && data?.checked_in_today) {
          markPunchButtonVerified(data.check_in);
        } else if (data?.success) {
          resetPunchButtonAvailable();
        }
      } catch (e) {
        console.warn("Punch state sync error:", e);
      }
    }

'''
          s = s[:start] + replacement + s[end+1:]

          marker = "    function markPunchButtonVerified(timeIso) {"
          idx = s.index(marker)
          reset_fn = '''    function resetPunchButtonAvailable() {
      const btn = document.getElementById('btn-punch-attendance');
      const icon = document.getElementById('punch-btn-icon');
      const text = document.getElementById('punch-btn-text');
      const sync = document.getElementById('punch-last-sync');

      if (!btn) return;
      btn.className = "w-full py-4 px-4 bg-gradient-to-r from-matrixGreen via-[#33ff88] to-cyberVolt text-black font-brand font-extrabold text-base tracking-wider rounded-2xl shadow-glow-green hover:brightness-110 active:scale-95 transition-all uppercase flex items-center justify-center gap-2 cursor-pointer relative overflow-hidden";
      btn.onclick = openDeskQRScanner;
      btn.disabled = false;
      if (icon) icon.innerText = "📷";
      if (text) text.innerText = "SCAN DESK QR TO PUNCH ATTENDANCE";
      if (sync) sync.innerText = "Today's Check-in: Not Logged";
    }

'''
          s = s[:idx] + reset_fn + s[idx:]
          p.write_text(s)

          # ---- One-time runner removes itself after successful patch ----
          wf = Path('.github/workflows/one-time-nexus-hotfix.yml')
          wf.unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-core.html index.html .github/workflows/one-time-nexus-hotfix.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: NEXUS admin renewal PIN and attendance refresh NEXUS-HOTFIX-APPLIED"
          git push
