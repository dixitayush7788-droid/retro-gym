name: Fix public gym resolver

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-public-gym-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch athlete portal tenant lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"const \\{ data: gymData, error \\} = await db\\s*"
              r"\\.from\\('gyms'\\)\\s*"
              r"\\.select\\('\\*'\\)\\s*"
              r"\\.eq\\('slug', currentGymSlug\\)\\s*"
              r"\\.maybeSingle\\(\\);"
          )

          replacement = "const { data: gymData, error } = await db.rpc('rpc_get_public_gym_by_slug', { p_slug: currentGymSlug });"
          text2, count = pattern.subn(replacement, text)

          if count == 0:
              raise SystemExit('Expected athlete gym lookup pattern was not found')

          path.write_text(text2, encoding='utf-8')
          print(f'Patched {count} tenant lookup(s)')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: resolve athlete gym publicly via secure RPC [auto-public-gym-fix]'
          git push
