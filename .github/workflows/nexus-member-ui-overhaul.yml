name: NEXUS Member UI Overhaul

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-member-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inject presentation layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- NEXUS PREMIUM MEMBER UI OVERHAUL 2026-08-26 -->'
          if marker not in s:
              tag = '\n' + marker + '\n<script src="./nexus-member-ui.js"></script>\n'
              if '</head>' not in s:
                  raise SystemExit('index.html: </head> not found')
              s = s.replace('</head>', tag + '</head>', 1)
              p.write_text(s, encoding='utf-8')
              print('Injected member UI layer.')
          else:
              print('Member UI layer already injected.')
          PY
      - name: Verify and persist
        shell: bash
        run: |
          grep -q 'nexus-member-ui.js' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/nexus-member-ui-overhaul.yml
          git commit -m 'feat(member-ui): premium member portal redesign'
          git push
