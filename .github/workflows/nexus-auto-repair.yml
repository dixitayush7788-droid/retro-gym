name: NEXUS auto repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[nexus-auto-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch production frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) The secure memberAuth module already contains the correct RPC-based
          # login implementation, but the override was never invoked. Invoke it
          # automatically so the phone/PIN flow cannot fall back to the legacy
          # direct-table/plaintext-password path.
          p = Path('assets/js/memberAuth.js')
          s = p.read_text()
          marker = 'installPortalAuthOverrides();'
          if marker not in s:
              s = s.rstrip() + "\\n\\nif (typeof window !== 'undefined') {\\n  installPortalAuthOverrides();\\n}\\n"
              p.write_text(s)

          # 2) The Super Admin page creates an early local Supabase client before
          # the canonical module client finishes session bootstrap. Sync that
          # local binding to the authenticated canonical client before fleet load.
          p = Path('assets/js/superAdmin.js')
          s = p.read_text()
          needle = '      cachedSuperAdminContext = {'
          inject = "      try { if (typeof db !== 'undefined') db = supabase; } catch (_) {}\\n\\n"
          if inject.strip() not in s:
              if needle not in s:
                  raise SystemExit('superAdmin.js insertion point not found')
              s = s.replace(needle, inject + needle, 1)
              p.write_text(s)

          # 3) Member QR attendance must not write directly to the attendance
          # table from an unauthenticated member browser. Route the punch through
          # the new session-bound SECURITY DEFINER RPC and stop writing the
          # nonexistent members.streak_count column.
          p = Path('index.html')
          s = p.read_text()
          start = s.find('    async function executeVerifiedAttendancePunch() {')
          end_marker = '    // --------------------------------------------------------\\n    // ATTENDANCE LOGS HISTORY STREAM'
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('index.html attendance function markers not found')
          new_fn = r'''    async function executeVerifiedAttendancePunch() {
      if (!currentAthlete || !db) return;

      const secureSession = window.__nexusMemberSession || (() => {
        try { return JSON.parse(localStorage.getItem('rg_member_session') || 'null'); } catch (_) { return null; }
      })();
      const memberId = currentAthlete.id;
      const sessionToken = secureSession?.session_token;
      const gymSlug = currentGymSlug;

      if (!memberId || !String(memberId).includes('-') || !sessionToken || !gymSlug) {
        showToast('Secure member session missing. Please log in again.', 'error');
        return;
      }

      try {
        const qrToken = `AUTH_DESK_QR_${gymSlug}_2026`;
        const { data, error } = await db.rpc('rpc_member_check_in', {
          p_gym_slug: gymSlug,
          p_member_id: memberId,
          p_session_token: sessionToken,
          p_qr_token: qrToken
        });

        if (error) throw error;
        if (!data?.success) throw new Error(data?.error || 'Attendance punch rejected');

        currentAthlete.streak_count = Number(data.streak_count || 0);
        localStorage.setItem('rg_member_session', JSON.stringify({
          ...(secureSession || {}),
          ...currentAthlete,
          id: memberId,
          member_id: memberId,
          gym_slug: gymSlug,
          session_token: sessionToken,
          saved_at: Date.now()
        }));
        window.__nexusMemberSession = {
          ...(secureSession || {}),
          ...currentAthlete,
          id: memberId,
          member_id: memberId,
          gym_slug: gymSlug,
          session_token: sessionToken,
          saved_at: Date.now()
        };

        markPunchButtonVerified(data.check_in);
        renderAthletePassHUD();
        fetchAthleteAttendanceHistory();
        playCyberChime('success');
        showToast(
          data.status === 'ALREADY_CHECKED_IN'
            ? `✓ Attendance already verified today! 🔥 Streak: ${currentAthlete.streak_count} Days!`
            : `✓ Desk QR Attendance Verified! 🔥 Streak: ${currentAthlete.streak_count} Days!`,
          'success'
        );
      } catch (err) {
        playCyberChime('alert');
        showToast('Attendance sync error: ' + (err.message || err), 'error');
      }
    }

'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)

          print('NEXUS frontend repair patches applied')

      - name: Commit repaired production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/memberAuth.js assets/js/superAdmin.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair fleet sync member auth and secure attendance [nexus-auto-repair]"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/nexus-auto-repair.yml || true
          git diff --cached --quiet || (git commit -m "chore: remove temporary repair workflow [nexus-auto-repair]" && git push)