name: Apply referral and admin session hardening

on:
  push:
    branches:
      - fix/referral-reward-and-admin-session

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch frontend auth and referral flow
        shell: python
        run: |
          from pathlib import Path

          # Admin auth must be tab/session scoped. Member auth keeps normal persistence.
          p = Path('assets/js/supabaseClient.js')
          s = p.read_text()
          old = """  const clientConfig = {\n    auth: {\n      persistSession: true,\n      autoRefreshToken: true,\n      detectSessionInUrl: true,\n      storage: typeof window !== 'undefined' ? window.localStorage : undefined\n    }\n  };"""
          new = """  const isAdminSurface = typeof window !== 'undefined' && /(?:^|\\/)admin(?:-login|\\.html)|(?:^|\\/)super-admin\\.html$/i.test(window.location.pathname);\n  const authStorage = typeof window !== 'undefined'\n    ? (isAdminSurface ? window.sessionStorage : window.localStorage)\n    : undefined;\n\n  const clientConfig = {\n    auth: {\n      persistSession: true,\n      autoRefreshToken: true,\n      detectSessionInUrl: true,\n      storage: authStorage\n    }\n  };"""
          if old not in s:
              raise SystemExit('supabaseClient.js target block not found')
          p.write_text(s.replace(old, new))

          # The legacy admin page creates its own Supabase client; force it onto the same
          # session-scoped storage so it cannot resurrect an old localStorage admin session.
          p = Path('admin-core.html')
          s = p.read_text()
          old = "const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;"
          new = "const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.sessionStorage } }) : null;"
          if old not in s:
              raise SystemExit('admin-core db client target not found')
          s = s.replace(old, new, 1)

          # Referral rewards are now atomic/idempotent in the DB trigger. The old UI insert
          # used columns that do not exist (reward_days/reward_applied_at) and silently failed.
          old = """          // 6. Record Referral Reward in referral_ledger\n          if (refMemberId) {\n            try {\n              await db.from('referral_ledger').insert([{\n                gym_id: gymIntId,\n                referrer_member_id: refMemberId,\n                referred_member_id: newMemberId,\n                reward_days: 7,\n                reward_applied_at: new Date().toISOString()\n              }]);\n            } catch (rErr) {\n              console.warn(\"Referral ledger note:\", rErr);\n            }\n          }"""
          new = """          // 6. Referral reward is applied atomically by the database trigger on\n          // member_memberships insert. Do not duplicate it from the browser.\n          // This keeps the 7-day reward idempotent and prevents schema drift.\n          if (refMemberId) {\n            console.info('[REFERRAL] 7-day reward handled by database transaction.');\n          }"""
          if old not in s:
              raise SystemExit('admin-core referral block not found')
          s = s.replace(old, new, 1)

          # PIN status/reset must use the actual pin_hash column.
          s = s.replace("const hasPin = Boolean(m.password || m.profile_id);", "const hasPin = Boolean(m.pin_hash || m.password || m.profile_id);", 1)
          s = s.replace(".update({ password: null })", ".update({ pin_hash: null })", 1)

          p.write_text(s)

          # Remove the temporary workflow after applying the real source changes.
          Path('.github/workflows/apply-referral-session-fix.yml').unlink()

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/supabaseClient.js admin-core.html
          git commit -m "fix: make referrals atomic and admin sessions non-persistent" || exit 0
          git push
