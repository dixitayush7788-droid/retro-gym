<body class="min-h-screen bg-void text-zinc-100 flex items-center justify-center p-4 relative selection:bg-gold selection:text-black">
  <div id="nexus-offline-banner" class="fixed top-0 left-0 right-0 z-[9999] bg-amber-500 text-black text-xs font-mono font-bold py-1.5 px-4 text-center transform -translate-y-full transition-transform duration-300 shadow-lg flex items-center justify-center gap-2">
    <span class="animate-pulse">⚠️</span><span>OFFLINE MODE — Authentication requires active internet connection.</span>
  </div>
  <div class="fixed inset-0 pointer-events-none scanlines-overlay z-0 opacity-40"></div>
  <div class="w-full max-w-md bg-surfaceCard/95 border border-gold/30 rounded-3xl p-6 sm:p-8 shadow-glow-card relative z-10 space-y-6 backdrop-blur-xl">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-gold/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyanCustom/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="text-center space-y-2 relative z-10">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-gold/30 via-goldLight/20 to-cyanCustom/20 border border-gold/50 text-goldLight flex items-center justify-center mx-auto shadow-glow-gold">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1 class="font-display text-3xl text-white tracking-wider leading-none">NEXUS COMMAND</h1>
      <p id="targetGymBadge" class="text-xs font-mono uppercase tracking-wider text-amber-300/80">Staff & Admin Zero-Trust Portal</p>
    </div>
    <div id="loginErrorAlert" class="hidden p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-xs font-mono text-rose-300 space-y-1">
      <div class="flex items-center gap-2 font-bold text-rose-400"><span>⚠️</span><span id="loginErrorTitle">Authentication Failed</span></div>
      <p id="loginErrorText" class="text-[11px] text-rose-200/90 leading-relaxed"></p>
    </div>
    <form id="adminLoginForm" class="space-y-4 relative z-10">
      <div class="space-y-1.5"><label for="adminEmail" class="block text-[11px] font-mono uppercase tracking-wider text-zinc-400">Staff Email Address</label><input type="email" id="adminEmail" name="email" required placeholder="admin@nexusgym.io" autocomplete="email" class="w-full bg-surfaceMuted/80 border border-white/15 focus:border-gold rounded-2xl px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none transition-all" /></div>
      <div class="space-y-1.5"><label for="adminPassword" class="block text-[11px] font-mono uppercase tracking-wider text-zinc-400">Password</label><input type="password" id="adminPassword" name="password" required placeholder="••••••••••••" autocomplete="current-password" class="w-full bg-surfaceMuted/80 border border-white/15 focus:border-gold rounded-2xl px-4 py-3 text-sm text-white placeholder-zinc-500 outline-none transition-all" /></div>
      <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 bg-gradient-to-r from-gold via-goldLight to-cyanCustom text-black font-display text-lg tracking-wider rounded-2xl shadow-glow-gold hover:brightness-110 active:scale-95 transition-all uppercase cursor-pointer font-bold mt-2">Sign In To Console ⚡</button>
    </form>
    <div class="text-center -mt-2"><a id="forgotPasswordLink" href="./reset-password.html" class="text-goldLight hover:text-white hover:underline text-xs font-mono">Forgot password? Reset securely →</a></div>
    <div class="pt-3 border-t border-white/10 flex items-center justify-between text-xs font-mono text-zinc-400"><a id="backToPassLink" href="./index.html" class="text-goldLight hover:underline">← Member Pass</a><span class="text-zinc-500 text-[10px]">Zero-Trust Guard v2.0</span></div>
  </div>

  <script type="module">
    import { supabase } from './assets/js/supabaseClient.js';

    const urlParams = new URLSearchParams(window.location.search);
    // Never invent a tenant. Missing/obsolete tenant URLs are resolved from the authenticated account.
    const requestedGymSlug = (urlParams.get('gym') || '').trim().toLowerCase() || null;
    const rawRedirect = urlParams.get('redirect');
    function getSafeRedirect(param) {
      if (!param) return null;
      const clean = param.trim();
      if (clean.startsWith('http://') || clean.startsWith('https://') || clean.startsWith('//') || clean.startsWith('javascript:') || clean.includes(':')) return null;
      if (clean === 'super-admin.html' || clean === 'admin.html' || clean === 'index.html' || clean.endsWith('.html')) return clean.startsWith('./') ? clean : `./${clean}`;
      return null;
    }
    const redirectParam = getSafeRedirect(rawRedirect);

    const badge = document.getElementById('targetGymBadge');
    if (badge) badge.innerText = redirectParam && redirectParam.includes('super-admin.html') ? 'Platform Control: Master Fleet' : (requestedGymSlug ? `Tenant Station: @${requestedGymSlug}` : 'Tenant Station: Resolving from account…');
    const backLink = document.getElementById('backToPassLink');
    if (backLink) backLink.href = requestedGymSlug ? `./index.html?gym=${encodeURIComponent(requestedGymSlug)}` : './index.html';
    const forgotLink = document.getElementById('forgotPasswordLink');
    if (forgotLink && redirectParam) forgotLink.href = `./reset-password.html?redirect=${encodeURIComponent(rawRedirect || '')}`;

    const form = document.getElementById('adminLoginForm');
    const errBox = document.getElementById('loginErrorAlert');
    const errText = document.getElementById('loginErrorText');
    const submitBtn = document.getElementById('loginSubmitBtn');

    function isSuperAdminUser(user, context) {
      if (context) {
        if (context.is_super_admin === true || context.is_admin === true) return true;
        if (context.role && String(context.role).toUpperCase() === 'SUPER_ADMIN') return true;
        if (Array.isArray(context.roles) && context.roles.some(r => String(typeof r === 'string' ? r : (r?.role || r?.role_name || r?.name || '')).toUpperCase() === 'SUPER_ADMIN')) return true;
      }
      if (user) {
        const appMeta = user.app_metadata || {}, userMeta = user.user_metadata || {};
        if (appMeta.is_super_admin === true || userMeta.is_super_admin === true) return true;
        if (String(appMeta.role || '').toUpperCase() === 'SUPER_ADMIN' || String(userMeta.role || '').toUpperCase() === 'SUPER_ADMIN') return true;
        if (Array.isArray(appMeta.roles) && appMeta.roles.some(r => String(r).toUpperCase() === 'SUPER_ADMIN')) return true;
        if (Array.isArray(userMeta.roles) && userMeta.roles.some(r => String(r).toUpperCase() === 'SUPER_ADMIN')) return true;
      }
      return false;
    }

    async function resolveTenantForUser(user, context) {
      const roles = Array.isArray(context?.roles) ? context.roles : [];
      const matching = requestedGymSlug ? roles.find(r => String(r?.gym_slug || '').toLowerCase() === requestedGymSlug) : null;
      if (matching?.gym_slug) return matching.gym_slug;
      const tenantRole = roles.find(r => r?.gym_slug && String(r?.role || '').toUpperCase() !== 'SUPER_ADMIN');
      if (tenantRole?.gym_slug) return String(tenantRole.gym_slug).trim().toLowerCase();
      if (context?.gym_slug) return String(context.gym_slug).trim().toLowerCase();
      const metaSlug = user?.user_metadata?.gym_slug || user?.app_metadata?.gym_slug;
      if (metaSlug) return String(metaSlug).trim().toLowerCase();
      try {
        const { data: rows } = await supabase.from('user_roles').select('gym_id').eq('user_id', user.id).not('gym_id', 'is', null).limit(1);
        const gymId = rows?.[0]?.gym_id;
        if (gymId) {
          const { data: gym } = await supabase.from('gyms').select('slug').eq('id', gymId).maybeSingle();
          if (gym?.slug) return String(gym.slug).trim().toLowerCase();
        }
      } catch (e) { console.warn('[ADMIN LOGIN] Tenant lookup note:', e); }
      return null;
    }

    async function requestedGymExists(slug) {
      if (!slug) return false;
      try {
        const { data, error } = await supabase.from('gyms').select('id, slug').eq('slug', slug).maybeSingle();
        return !error && !!data;
      } catch (e) { return false; }
    }

    async function routeAuthenticatedUser(user, context) {
      if (isSuperAdminUser(user, context)) {
        window.location.href = './super-admin.html';
        return;
      }
      if (redirectParam && redirectParam !== './admin.html' && redirectParam !== 'admin.html') {
        window.location.href = redirectParam;
        return;
      }

      const targetGym = await resolveTenantForUser(user, context);
      if (!targetGym) throw new Error('Gym tenant could not be resolved for this account. Please use the official gym admin link generated by Super Admin.');

      // If the URL contains an obsolete/nonexistent slug (e.g. an old test link), recover safely to the user's assigned gym.
      // If the slug is a real tenant, enforce tenant ownership and never cross the boundary.
      if (requestedGymSlug) {
        const exists = await requestedGymExists(requestedGymSlug);
        if (exists && requestedGymSlug !== targetGym) {
          throw new Error(`Account is not assigned to tenant @${requestedGymSlug}. Please use the assigned gym admin link.`);
        }
      }

      window.location.href = `./admin.html?gym=${encodeURIComponent(targetGym)}`;
    }

    async function checkExistingSession() {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session?.user) return;
        let context = null;
        try { const { data: rpcContext } = await supabase.rpc('rpc_get_current_user_context'); context = rpcContext; } catch (e) { console.warn('[ADMIN LOGIN] Context resolution note:', e); }
        try { await routeAuthenticatedUser(session.user, context); } catch (e) { console.warn('[ADMIN LOGIN] Existing session routing stopped:', e.message); }
      } catch (e) { console.warn('Session check note:', e); }
    }
    checkExistingSession();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'AUTHENTICATING...';
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data?.session || !data?.user) throw new Error('Could not establish session. Please verify credentials.');
        submitBtn.innerText = 'SUCCESS! RESOLVING GYM...';
        let context = null;
        try { const { data: rpcContext, error: ctxErr } = await supabase.rpc('rpc_get_current_user_context'); if (!ctxErr) context = rpcContext; } catch (e) { console.warn('[ADMIN LOGIN] Context role resolution note:', e); }
        await routeAuthenticatedUser(data.user, context);
      } catch (err) {
        console.error('[ADMIN LOGIN] Error:', err);
        errText.innerText = err.message || 'Invalid login credentials. Please try again.';
        errBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In To Console ⚡';
      }
    });

    window.addEventListener('offline', () => document.getElementById('nexus-offline-banner')?.classList.remove('-translate-y-full'));
    window.addEventListener('online', () => document.getElementById('nexus-offline-banner')?.classList.add('-translate-y-full'));
  </script>
</body>
